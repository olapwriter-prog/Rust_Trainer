name: CI

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * *"   # daily: catch engine drift early (engine-head job)
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  x86_64:
    name: x86_64 tests (AVX2 + scalar engine kernels)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --no-default-features -- -D warnings
      - run: cargo test
      - name: engine scalar fallback kernels (forward must stay bit-exact)
        run: cargo test --test engine
        env:
          RIE_DISABLE: simd
      - name: without the engine (HF safetensors path only)
        run: cargo test --no-default-features
      - name: CLI end to end on a synthetic GGUF
        run: |
          cargo build --release
          B=target/release/rust_trainer
          $B synth --arch qwen3 --wtype Q4_0 --out m.gguf
          python3 -c "import json;[print(json.dumps({'id':f'r{i}','prompt':f'the {i}','response':f'{i} the!','confirmed':True})) for i in range(60)]" > data.jsonl
          echo '{"stage":"deep","charging":true,"battery_pct":80,"temp_c":30}' > dev.json
          $B run --model m.gguf --data data.jsonl --status dev.json --threads 2 --no-pin --epochs 3 --batch 8 --lr 4e-3 --rank 4 --min-train 20 --heldout 0.2 --hours 0.05 | tee out.json
          grep -q '"outcome": "accepted"' out.json
          test -f m.adapters/$(cat m.adapters/ACTIVE)/adapter.gguf
          $B status --model m.gguf
          $B rollback --model m.gguf --reason ci

  aarch64:
    name: AArch64 NEON / dotprod / i8mm (QEMU) — bit-exact with the engine
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu
      - run: sudo apt-get update && sudo apt-get install -y qemu-user gcc-aarch64-linux-gnu libc6-dev-arm64-cross
      - name: i8mm + dotprod (Armv8.6+)
        run: cargo test --target aarch64-unknown-linux-gnu --test engine --test gradcheck
      - name: dotprod only (Armv8.2-8.5)
        run: cargo test --target aarch64-unknown-linux-gnu --test engine
        env:
          RIE_DISABLE: i8mm
      - name: baseline NEON on Cortex-A53
        run: cargo test --target aarch64-unknown-linux-gnu --test engine
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: qemu-aarch64 -cpu cortex-a53 -L /usr/aarch64-linux-gnu

  mobile:
    name: Android / iOS build check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android, aarch64-apple-ios
      - run: cargo check --target aarch64-linux-android
      - run: cargo check --target x86_64-linux-android
      - run: cargo check --target aarch64-apple-ios

  real-model:
    name: Real models — engine parity and float64 gradient reference
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: python3 -m pip install --user numpy
      - name: Fetch models from Docker's open model catalog
        run: |
          python3 tools/fetch_docker_model.py ai/qwen3:0.6B-Q4_0 qwen3-0.6b-q4_0.gguf
          python3 tools/fetch_docker_model.py ai/qwen2.5:0.5B-F16 qwen2.5-0.5b-f16.gguf
          python3 tools/fetch_docker_model.py ai/smollm2:360M-Q4_0 smollm2-360m-q4_0.gguf
      - run: cargo build --release --example export_reference
      - name: Logits bit-exact with the engine; gradients vs an independent float64 reference
        run: |
          for m in qwen3-0.6b-q4_0 qwen2.5-0.5b-f16 smollm2-360m-q4_0; do
            echo "== $m"
            RT_GGUF=$PWD/$m.gguf cargo test --release --test engine real_model -- --ignored
            ./target/release/examples/export_reference $m.gguf ref.safetensors 4
            python3 tools/reference_check.py ref.safetensors
            rm -f ref.safetensors
          done

  engine-head:
    name: Engine drift — build and test against the engine's newest commit
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo update -p rie-core
      - run: git diff --stat Cargo.lock
      - run: cargo test --release --test engine --test agentd --test gradcheck
